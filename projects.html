  <style>html{background:#0b0c0d}</style>

  <!-- Paints a cover matching the outgoing transition tint before CSS loads,
       so an inbound transition never flashes white. -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('txLabel') === null) return;
        document.documentElement.classList.add('skip-boot');
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        document.documentElement.classList.add('tx-pending');
        var cover = document.createElement('div');
        cover.id = 'txInitCover';
        cover.style.cssText = 'position:fixed;inset:0;z-index:9890;pointer-events:none';
        cover.style.background = sessionStorage.getItem('txColor') || '#1a1614';
        document.documentElement.appendChild(cover);
      } catch (e) { /* Navigation remains usable without session storage. */ }
    })();
  </script>

<!doctype html>
<meta charset="utf-8">
<title>Portfolio motion checks</title>
<style>body{font:15px system-ui;margin:24px;background:#eeeae2;color:#292827}button,select{font:inherit;padding:8px}iframe{display:block;border:0;margin-top:16px;width:100%;height:720px}pre{white-space:pre-wrap}</style>
<h1>Portfolio motion checks</h1>
<p>Runs the actual landing page with a scripted pointer sweep. Reduced-motion and unavailable-WebGL cases use local test overrides; system preferences are untouched.</p>
<select id="mode"><option value="normal">Desktop motion</option><option value="mobile">Mobile touch · 390 × 844</option><option value="reduced">Reduced motion</option><option value="nogl">WebGL unavailable</option></select>
<button id="run">Run checks</button><pre id="result">Ready.</pre><iframe id="preview" title="Portfolio test"></iframe>
<script>
const output = document.getElementById('result');
const frame = document.getElementById('preview');
document.getElementById('run').onclick = async () => {
  const mode = document.getElementById('mode').value;
  output.textContent = 'Running…';
  frame.style.width = mode === 'mobile' ? '390px' : '100%';
  frame.style.height = mode === 'mobile' ? '844px' : '720px';
  const html = await (await fetch('../index.html', {cache:'no-store'})).text();
  const shim = `
    window.__qa = {readbacks:0,errors:[],frames:[],splats:0,cpu:[],contours:[],renderer:null,rafCpu:[]};
    const mode = ${JSON.stringify(mode)};
    const raf = window.requestAnimationFrame.bind(window);
    window.requestAnimationFrame = callback => raf(ts => {
      const start=performance.now();callback(ts);window.__qa.rafCpu.push(performance.now()-start);
    });
    const match = window.matchMedia.bind(window);
    window.matchMedia = query => {
      if (query.includes('prefers-reduced-motion')) return {matches:mode==='reduced',addEventListener(){},removeEventListener(){}};
      if (mode==='mobile' && query.includes('pointer: fine')) return {matches:false,addEventListener(){},removeEventListener(){}};
      return match(query);
    };
    const get = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function(type,...args) {
      if(mode==='nogl' && type.includes('webgl')) return null;
      const context = get.call(this,type,...args);
      if (context && type.includes('webgl')) {
        const debug = context.getExtension('WEBGL_debug_renderer_info');
        window.__qa.renderer = debug ? context.getParameter(debug.UNMASKED_RENDERER_WEBGL) : 'unavailable';
      }
      return context;
    };
    [window.WebGLRenderingContext,window.WebGL2RenderingContext].filter(Boolean).forEach(C => {
      const read = C.prototype.readPixels;
      C.prototype.readPixels = function(...args) { window.__qa.readbacks++; return read.apply(this,args); };
    });
    window.addEventListener('error', e => window.__qa.errors.push(e.message));
    sessionStorage.setItem('hasBooted','1');
  `;
  frame.srcdoc = html.replace('<head>', '<head><base href="'+new URL('../',location.href)+'"><script>'+shim+'<\/script>');
  frame.onload = () => {
    const w = frame.contentWindow;
    const qa = w.__qa;
    if (!qa || !w.Fluid) return;
    const splat = w.Fluid.splat;
    w.Fluid.splat = (...args) => {qa.splats++; return splat(...args);};
    const tick = w.Fluid.tick;
    w.Fluid.tick = (...args) => {const start=performance.now();const result=tick(...args);qa.cpu.push(performance.now()-start);return result;};
    const draw=w.Contours.draw;
    w.Contours.draw=(...args)=>{const start=performance.now();draw(...args);qa.contours.push(performance.now()-start);};
    let start, last;
    function sample(ts) {
      if (!start) start = ts;
      if (last && ts-start > 1200) qa.frames.push(ts-last);
      last = ts;
      const t=(ts-start)/1000;
      if (t > 1.2 && t < 4.2) {
        w.document.dispatchEvent(new w.PointerEvent('pointermove', {clientX:w.innerWidth*(.5+.35*Math.sin(t*3)),clientY:w.innerHeight*(.45+.25*Math.cos(t*4)),pointerType:mode==='mobile'?'touch':'mouse',bubbles:true}));
      }
      if (t < 5) {requestAnimationFrame(sample); return;}
      const values=qa.frames.sort((a,b)=>a-b);
      const rect=w.document.getElementById('portraitFrame').getBoundingClientRect();
      const reduced=mode==='reduced', fallback=mode==='nogl';
      const checks={
        'No runtime errors':qa.errors.length===0,
        'No GPU readbacks':qa.readbacks===0,
        'Expected renderer': reduced||fallback ? !w.Fluid.ready : w.Fluid.ready && w.document.body.classList.contains('gpu-portrait'),
        'Pointer produces fluid only with motion + WebGL':reduced||fallback ? qa.splats===0 : qa.splats>0,
        'Portrait intersects viewport':rect.bottom>0&&rect.top<w.innerHeight&&rect.right>0&&rect.left<w.innerWidth,
        'Touch does not slide the composition':mode!=='mobile'||!w.document.getElementById('slideGroup').style.transform,
        'No horizontal overflow':w.document.documentElement.scrollWidth===w.innerWidth
      };
      output.textContent=JSON.stringify({mode,checks,medianFrameMs:+values[Math.floor(values.length/2)].toFixed(2),p95FrameMs:+values[Math.floor(values.length*.95)].toFixed(2),readbacks:qa.readbacks,splats:qa.splats,errors:qa.errors,renderer:qa.renderer,fluidCpuMs:qa.cpu.reduce((a,b)=>a+b,0)/(qa.cpu.length||1),contourCpuMs:qa.contours.reduce((a,b)=>a+b,0)/(qa.contours.length||1),rafCpuMs:qa.rafCpu.reduce((a,b)=>a+b,0)/(qa.rafCpu.length||1)},null,2);
    }
    requestAnimationFrame(sample);
  };
};
</script>

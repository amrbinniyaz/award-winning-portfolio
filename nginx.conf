server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────
    # The single biggest win here: Dokploy's default static server ships CSS
    # and JS uncompressed, ~120kB that gzips to roughly a third.
    gzip on;
    gzip_vary on;              # tell caches the response varies by encoding
    gzip_comp_level 6;         # past 6 the extra CPU buys almost nothing
    gzip_min_length 256;       # below this the gzip header costs more than it saves
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;
    # Deliberately NOT gzipping webp/jpeg/png/woff2 payloads — they are already
    # compressed, and re-compressing burns CPU to make them marginally larger.

    # ── Caching ──────────────────────────────────────────────
    # Filenames are not content-hashed, so cache lifetimes are a tradeoff
    # between PageSpeed's "efficient cache policy" audit and shipping a fix.

    # Images and fonts: effectively immutable. A changed image gets a changed
    # name in practice, so a long life is safe.
    location ~* \.(webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # CSS/JS: short, because these DO change on every deploy under the same
    # filename. A long max-age here would leave visitors on stale styling with
    # no way to recover but a hard reload. ETags still make repeat hits cheap.
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # HTML: always revalidate, so a deploy is visible immediately.
    location ~* \.html?$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Misc ─────────────────────────────────────────────────
    # WebP is not in nginx's default mime.types on some builds.
    types {
        image/webp webp;
        image/avif avif;
    }
    include /etc/nginx/mime.types;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
